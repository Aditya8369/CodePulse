name: 📢 CI & Merge Status Feedback Bot

on:
  workflow_run:
    workflows: ["🧪 CI — Build, Tests & Typecheck Verification"]
    types: [completed]

permissions:
  pull-requests: write
  issues: write

jobs:
  notify-pr:
    name: 📝 Post Strict CI & Conflict Feedback
    # Only run on pull requests (not on direct commits to main)
    if: ${{ github.event.workflow_run.pull_requests[0] != null }}
    runs-on: ubuntu-latest
    steps:
      - name: 🤖 Process CI & Conflict Status
        uses: actions/github-script@v7
        with:
          script: |
            const prSummary = context.payload.workflow_run.pull_requests[0];
            const prNumber = prSummary.number;
            const author = (prSummary.head && prSummary.head.user && prSummary.head.user.login) ||
                           (prSummary.user && prSummary.user.login) || 'contributor';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const maintainer = 'code-with-abhi-i5';
            const isCiSuccess = context.payload.workflow_run.conclusion === 'success';

            console.log(`Processing CI & Conflict feedback for PR #${prNumber} by @${author} (Conclusion: ${context.payload.workflow_run.conclusion})...`);

            // 1. Fetch detailed PR info (to check merge conflict state)
            const prRes = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });
            const pr = prRes.data;
            const hasConflict = pr.mergeable === false || pr.mergeable_state === 'dirty' || pr.mergeable_state === 'conflicting';

            // 2. Fetch workflow run jobs to determine whether Frontend, Backend, or Both failed
            const jobsRes = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: context.payload.workflow_run.id
            });
            const jobs = jobsRes.data.jobs || [];
            const failedJobs = jobs.filter(j => j.conclusion === 'failure');

            const frontendFailed = failedJobs.some(j => j.name.toLowerCase().includes('frontend'));
            const backendFailed = failedJobs.some(j => j.name.toLowerCase().includes('backend'));
            const bothFailed = frontendFailed && backendFailed;
            const onlyFrontend = frontendFailed && !backendFailed;
            const onlyBackend = backendFailed && !frontendFailed;

            // 3. Look for existing CI feedback comment to avoid comment spam
            const commentsRes = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber
            });
            const identifier = "<!-- CODEPULSE-CI-FEEDBACK-BOT -->";
            const existingComment = commentsRes.data.find(c => c.body && c.body.includes(identifier));

            // Labels to add / remove
            const labelsToAdd = [];
            const labelsToRemove = [];

            if (!isCiSuccess) {
              labelsToAdd.push('status: failing-ci');
            } else {
              labelsToRemove.push('status: failing-ci');
            }

            if (hasConflict) {
              labelsToAdd.push('status: merge-conflict');
            } else {
              labelsToRemove.push('status: merge-conflict');
            }

            // Sync labels
            if (labelsToAdd.length > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: prNumber,
                  labels: labelsToAdd
                });
                console.log(`Added labels [${labelsToAdd.join(', ')}] to PR #${prNumber}`);
              } catch (e) {
                console.warn(`Could not add labels: ${e.message}`);
              }
            }

            for (const rem of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: prNumber,
                  name: rem
                });
                console.log(`Removed label '${rem}' from PR #${prNumber}`);
              } catch (e) {
                // Ignore if label did not exist
              }
            }

            // ========================================================
            // SCENARIO 1: ALL CHECKS GREEN & NO MERGE CONFLICTS
            // ========================================================
            if (isCiSuccess && !hasConflict) {
              const successMsg = `${identifier}\n` +
                `### 🎉 All CI Checks & Merge Status Passed!\n\n` +
                `Hello @${author}, your PR has **PASSED** all automated verifications:\n` +
                `- ✅ **Frontend Typecheck & Build:** Passed\n` +
                `- ✅ **Backend Typecheck & Build:** Passed\n` +
                `- ✅ **Merge Conflict Check:** Clean (up to date with \`main\`)\n\n` +
                `Maintainer (@${maintainer}) can now proceed with final code review and merge. Thank you for your contribution!`;

              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                  body: successMsg
                });
                console.log(`Updated comment to success on PR #${prNumber}`);
              }
              return;
            }

            // ========================================================
            // SCENARIO 2: CI FAILED OR MERGE CONFLICT DETECTED
            // ========================================================
            let title = `### ❌ [ACTION REQUIRED] CI Verification & Merge Status Alert`;
            if (bothFailed) {
              title = `### 🚨 [CRITICAL] Both Frontend & Backend CI Verification Failed`;
            } else if (onlyBackend) {
              title = `### ⚙️ [ACTION REQUIRED] Backend CI Verification Failed`;
            } else if (onlyFrontend) {
              title = `### 🎨 [ACTION REQUIRED] Frontend CI Verification Failed`;
            } else if (hasConflict && isCiSuccess) {
              title = `### 💥 [STRICT REQUIREMENT] Merge Conflicts Detected with \`main\``;
            }

            let commentBody = `${identifier}\n` +
              `${title}\n\n` +
              `Hello @${author}, your pull request has issues that **MUST be resolved** before it can be reviewed or merged by @${maintainer}.\n\n` +
              `#### 📊 Current Verification Breakdown:\n` +
              `- 🎨 **Frontend CI:** ${frontendFailed ? '❌ **FAILED**' : '✅ **PASSED**'}\n` +
              `- ⚙️ **Backend CI:** ${backendFailed ? '❌ **FAILED**' : '✅ **PASSED**'}\n` +
              `- 🔀 **Merge Status:** ${hasConflict ? '❌ **CONFLICTS WITH MAIN**' : '✅ **Clean**'}\n\n` +
              `---\n\n`;

            // STRICT MERGE CONFLICT SECTION (HARD ENFORCEMENT)
            if (hasConflict) {
              commentBody += `### 💥 STRICT NOTICE: MERGE CONFLICTS MUST BE RESOLVED\n\n` +
                `> ⚠️ **IMPORTANT:** Your branch is conflicting with the latest \`main\` branch. **Maintainers will NOT resolve merge conflicts for you.** You must rebase/merge and resolve conflicts on your local machine.\n\n` +
                `**How to resolve merge conflicts:**\n` +
                `\`\`\`bash\n` +
                `# 1. Switch to your feature branch\n` +
                `git checkout your-branch-name\n\n` +
                `# 2. Fetch the latest changes from the upstream repository\n` +
                `git fetch https://github.com/${owner}/${repo}.git main\n\n` +
                `# 3. Merge main into your branch (or use rebase)\n` +
                `git merge FETCH_HEAD\n\n` +
                `# 4. Open the conflicting files in VS Code / your editor and resolve all conflict markers (<<<<<<< HEAD)\n` +
                `# 5. After resolving, stage and commit the resolution\n` +
                `git add .\n` +
                `git commit -m "fix(merge): resolve merge conflicts with main"\n\n` +
                `# 6. Push to your branch\n` +
                `git push origin your-branch-name\n` +
                `\`\`\`\n\n` +
                `---\n\n`;
            }

            // FRONTEND FIX INSTRUCTIONS
            if (frontendFailed) {
              commentBody += `### 🎨 Frontend CI Error Fix Instructions\n\n` +
                `The frontend build or TypeScript check failed. Test and fix locally in the project root:\n` +
                `\`\`\`bash\n` +
                `# Run TypeScript verification to see all type errors\n` +
                `npx tsc --noEmit\n\n` +
                `# Run the production build locally to verify\n` +
                `npm run build\n\n` +
                `# Run frontend tests\n` +
                `npx vitest run\n` +
                `\`\`\`\n\n` +
                `---\n\n`;
            }

            // BACKEND FIX INSTRUCTIONS
            if (backendFailed) {
              commentBody += `### ⚙️ Backend CI Error Fix Instructions\n\n` +
                `The backend build or NestJS typecheck failed. Test and fix locally inside the \`backend\` folder:\n` +
                `\`\`\`bash\n` +
                `# 1. Navigate to backend directory\n` +
                `cd backend\n\n` +
                `# 2. Generate Prisma client types\n` +
                `npx prisma generate\n\n` +
                `# 3. Build backend to see compilation errors\n` +
                `npm run build\n` +
                `\`\`\`\n\n` +
                `---\n\n`;
            }

            // CLOSING NOTE
            commentBody += `### 🚀 How to submit your fixes:\n` +
              `After fixing errors locally and verifying that both build and tests pass:\n` +
              `\`\`\`bash\n` +
              `git add .\n` +
              `git commit -m "fix: resolve CI errors and merge conflicts"\n` +
              `git push origin your-branch-name\n` +
              `\`\`\`\n` +
              `*GitHub Actions will automatically re-run checks as soon as you push.*\n\n` +
              `> 💡 **Notice:** Your PR is **NOT closed** and your assigned issue remains yours. Please resolve these checks promptly so maintainers can review and merge your work!`;

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body: commentBody
              });
              console.log(`Updated existing CI feedback comment on PR #${prNumber}`);
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: commentBody
              });
              console.log(`Created new CI feedback comment on PR #${prNumber}`);
            }
