name: 📢 CI Status Feedback Bot

on:
  workflow_run:
    workflows: ["🧪 CI — Build, Tests & Typecheck Verification"]
    types: [completed]

permissions:
  pull-requests: write
  issues: write

jobs:
  notify-pr:
    name: 📝 Post CI Status & Guidance
    # Only run on pull requests (not on direct commits to main)
    if: ${{ github.event.workflow_run.pull_requests[0] != null }}
    runs-on: ubuntu-latest
    steps:
      - name: 🤖 Process CI Result & Update PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.workflow_run.pull_requests[0];
            const prNumber = pr.number;
            const author = (pr.head && pr.head.user && pr.head.user.login) ||
                           (pr.user && pr.user.login) || 'contributor';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const isSuccess = context.payload.workflow_run.conclusion === 'success';

            console.log(`Processing CI feedback for PR #${prNumber} by @${author} (Conclusion: ${context.payload.workflow_run.conclusion})...`);

            // Fetch workflow run jobs to determine which check failed
            const jobsRes = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: context.payload.workflow_run.id
            });
            const jobs = jobsRes.data.jobs || [];
            const failedJobs = jobs.filter(j => j.conclusion === 'failure');

            const frontendFailed = failedJobs.some(j => j.name.toLowerCase().includes('frontend'));
            const backendFailed = failedJobs.some(j => j.name.toLowerCase().includes('backend'));

            // Look for existing CI feedback comment to avoid duplicate spam
            const commentsRes = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber
            });
            const identifier = "<!-- CODEPULSE-CI-FEEDBACK-BOT -->";
            const existingComment = commentsRes.data.find(c => c.body && c.body.includes(identifier));

            if (!isSuccess) {
              // 1. Add status label
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: prNumber,
                  labels: ['status: failing-ci']
                });
                console.log(`Added label 'status: failing-ci' to PR #${prNumber}`);
              } catch (e) {
                console.warn(`Could not add label: ${e.message}`);
              }

              // 2. Build helpful failure guidance
              let guidance = `${identifier}\n` +
                `### ❌ CI Build & Typecheck Alert\n\n` +
                `Hello @${author}, your latest commit did not pass our automated CI verification.\n\n` +
                `**Status Breakdown:**\n` +
                `- 🎨 Frontend Check: ${frontendFailed ? '❌ **Failed**' : '✅ **Passed**'}\n` +
                `- ⚙️ Backend Check: ${backendFailed ? '❌ **Failed**' : '✅ **Passed**'}\n\n` +
                `---\n\n` +
                `### 🛠️ How to fix locally on your machine:\n\n`;

              if (frontendFailed) {
                guidance += `#### 🎨 Frontend Errors Fix:\n` +
                  `Run the following in the project root:\n` +
                  `\`\`\`bash\n` +
                  `npm run build\n` +
                  `npx tsc --noEmit\n` +
                  `\`\`\`\n` +
                  `Check the output in your terminal and resolve any reported TypeScript or build errors.\n\n`;
              }

              if (backendFailed) {
                guidance += `#### ⚙️ Backend Errors Fix:\n` +
                  `Run the following inside the \`backend\` directory:\n` +
                  `\`\`\`bash\n` +
                  `cd backend\n` +
                  `npx prisma generate\n` +
                  `npm run build\n` +
                  `\`\`\`\n` +
                  `Resolve any compilation or dependency errors reported.\n\n`;
              }

              guidance += `Once you have fixed the errors locally, commit and push to this same branch:\n` +
                `\`\`\`bash\n` +
                `git add .\n` +
                `git commit -m "fix: resolve CI build and typecheck errors"\n` +
                `git push\n` +
                `\`\`\`\n` +
                `*CI checks will automatically re-run on your new commit.*\n\n` +
                `> 💡 **Friendly Note:** Your PR is **NOT closed** and your assigned issue remains yours. Please resolve these checks so project maintainers can review and merge your contribution!`;

              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                  body: guidance
                });
                console.log(`Updated existing CI feedback comment on PR #${prNumber}`);
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: guidance
                });
                console.log(`Created new CI feedback comment on PR #${prNumber}`);
              }
            } else {
              // On Success: Remove failing-ci label and update comment
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: prNumber,
                  name: 'status: failing-ci'
                });
                console.log(`Removed label 'status: failing-ci' from PR #${prNumber}`);
              } catch (e) {
                // Label may not exist, safe to ignore
              }

              if (existingComment) {
                const successMsg = `${identifier}\n` +
                  `### 🎉 CI Verification Passed!\n\n` +
                  `Hello @${author}, all build, typecheck, and test checks have **PASSED** on this branch! ✅\n\n` +
                  `Maintainers have been notified and will proceed with code review. Thank you for your contribution!`;
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                  body: successMsg
                });
                console.log(`Updated comment to passed status on PR #${prNumber}`);
              }
            }
