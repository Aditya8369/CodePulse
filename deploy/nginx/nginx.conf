# ==============================================================================
# CodePulse Production Nginx Reverse Proxy Configuration
# Hardened SSL/TLS with Let's Encrypt ACME HTTP-01 Validation
# Qualys SSL Labs A+ Rated Security Architecture
# ==============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Formats with Correlated Request & Trace IDs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time" '
                    'traceparent="$http_traceparent"';

    access_log /var/log/nginx/access.log main;

    # Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstream Clusters
    upstream codepulse_backend {
        server backend:3999 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream codepulse_frontend {
        server frontend:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ==========================================================================
    # HTTP Server: ACME HTTP-01 Challenge + Permanent 301 HTTPS Redirection
    # ==========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name codepulse.io www.codepulse.io api.codepulse.io;

        # Let's Encrypt ACME HTTP-01 Challenge directory for certbot renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
            try_files $uri =404;
        }

        # Health probe endpoint for cloud load balancers & Route 53
        location /healthz {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Redirect all other HTTP traffic to HTTPS with HSTS compliance
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================================================
    # HTTPS Server: A+ Rated TLS 1.2 / TLS 1.3 Reverse Proxy
    # ==========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name codepulse.io www.codepulse.io;

        # SSL Certificates (Automated ACME Let's Encrypt mount)
        ssl_certificate /etc/letsencrypt/live/codepulse.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/codepulse.io/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/codepulse.io/chain.pem;

        # TLS Protocols & Cipher Suites (Qualys SSL Labs A+ Rated)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;

        # Session Resumption & Performance
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Backend API Routing
        location /api/ {
            proxy_pass http://codepulse_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # W3C Distributed Tracing header passthrough
            proxy_set_header traceparent $http_traceparent;
            proxy_set_header tracestate $http_tracestate;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Real-time WebSocket Gateway for Live Battle Engine
        location /socket.io/ {
            proxy_pass http://codepulse_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Frontend Next.js Application Proxy
        location / {
            proxy_pass http://codepulse_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
