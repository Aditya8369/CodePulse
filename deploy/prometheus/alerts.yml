groups:
  - name: codepulse_golden_signals_predictive_alerts
    interval: 1m
    rules:
      # 1. LATENCY: 20-minute predictive P95 latency creep & >3 sigma seasonal anomaly
      - alert: CodePulsePredictiveLatencyCreep20m
        expr: |
          predict_linear(histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))[15m:1m], 1200) > 0.75
        for: 2m
        labels:
          severity: warning
          signal: latency
          engine: holt-winters-predict-linear
        annotations:
          summary: "Predictive P95 latency projected to exceed 750ms within 20 minutes"
          description: "20-minute linear trajectory forecast indicates sustained latency creep before service degradation."

      - alert: CodePulseLatencySeasonal3SigmaAnomaly
        expr: |
          (
            histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))
            - avg_over_time(histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))[1h:1m])
          )
          / clamp_min(stddev_over_time(histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))[1h:1m]), 0.005)
          > 3
        for: 2m
        labels:
          severity: critical
          signal: latency
        annotations:
          summary: "HTTP P95 latency exceeded +3 sigma seasonal confidence band"
          description: "Observed P95 latency deviated more than 3 standard deviations above dynamic rolling baseline."

      # 2. TRAFFIC: Sudden >3 sigma drop or surge relative to seasonal traffic baseline
      - alert: CodePulseTrafficSeasonalAnomaly
        expr: |
          abs(
            sum(rate(http_requests_total[5m]))
            - avg_over_time(sum(rate(http_requests_total[5m]))[1h:1m])
          )
          / clamp_min(stddev_over_time(sum(rate(http_requests_total[5m]))[1h:1m]), 1)
          > 3
        for: 3m
        labels:
          severity: warning
          signal: traffic
        annotations:
          summary: "Inbound request traffic deviated >3 sigma from seasonal expectation"
          description: "Adaptive seasonal bounds flagged abnormal traffic surge or ingestion drop."

      # 3. ERRORS: Predictive 5xx error budget burn & >3 sigma spike
      - alert: CodePulsePredictiveErrorRateSpike20m
        expr: |
          predict_linear(
            (sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1))[15m:1m],
            1200
          ) > 0.02
        for: 2m
        labels:
          severity: critical
          signal: errors
        annotations:
          summary: "5xx error ratio predicted to breach 2% within 20 minutes"
          description: "PromQL predict_linear detected rising error rate trajectory."

      # 4. SATURATION: Memory leak & container OOM prediction 20 minutes before failure
      - alert: CodePulsePredictiveMemoryLeakSaturation20m
        expr: |
          predict_linear(process_resident_memory_bytes[15m], 1200) > 1073741824
        for: 3m
        labels:
          severity: critical
          signal: saturation
        annotations:
          summary: "Process RSS memory projected to exceed 1GiB within 20 minutes (memory leak trajectory)"
          description: "Holt-Winters / predict_linear trajectory indicates memory exhaustion within 20 minutes."
